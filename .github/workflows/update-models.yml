name: Update YOLO Model Registry

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 台灣時間 08:00
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate yolo_models.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/generate_models.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yolo_models.json
          if git diff --cached --quiet; then
            echo "No changes — registry already up to date."
          else
            git commit -m "chore: update yolo_models.json"
            git push
          fi
